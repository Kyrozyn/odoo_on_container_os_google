services:
  db:
    image: postgres:17-alpine
    container_name: odoo_postgres
    restart: always
    environment:
      - POSTGRES_DB=odoo
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=tAIre2vRTXDgRFSlqUy2kBFF
      - PGDATA=/var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c maintenance_work_mem=32MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=8MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
    volumes:
      - /var/odoo/postgres_data:/var/lib/postgresql/data/pgdata

  odoo:
    image: odoo:20.0
    container_name: odoo_web
    restart: always
    depends_on:
      - db
    expose:
      - "8069"
      - "8072"
    volumes:
      - /var/odoo/data:/var/lib/odoo
      - /var/odoo/addons:/mnt/extra-addons
      - /var/odoo/config/odoo.conf:/etc/odoo/odoo.conf
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=tAIre2vRTXDgRFSlqUy2kBFF

  nginx:
    image: jonasal/nginx-certbot:latest
    container_name: odoo_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CERTBOT_EMAIL=your-email@example.com
    volumes:
      - /var/odoo/nginx_conf:/etc/nginx/user_conf.d:ro
      - /var/odoo/letsencrypt:/etc/letsencrypt
    depends_on:
      - odoo